<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GCync - Gordon College Calendar Sync</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #EBF8EE;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 1050px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 60px;
    }

   
    .left-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .brand-header {
      margin-bottom: 40px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .calendar-icon-box {
      width: 38px;
      height: 38px;
      background-color: #0E6C45;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .calendar-icon-box svg {
      width: 22px;
      height: 22px;
    }

    .brand-title {
      font-size: 32px;
      font-weight: 800;
      color: #0E6C45;
      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      font-size: 11px;
      font-weight: 600;
      color: #798E82;
      letter-spacing: 0.8px;
      margin-top: 6px;
      text-transform: uppercase;
    }

    .illustration-container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      text-align: center;
    }

    .illustration-img {
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    
    .right-section {
      flex: 1;
      max-width: 460px;
    }

    .login-card {
      background: #FFFFFF;
      padding: 55px 45px;
      border-radius: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
    }

    .login-card h1 {
      font-size: 32px;
      font-weight: 800;
      color: #0E6C45;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .login-card .subtitle {
      font-size: 13px;
      color: #7D8E84;
      font-weight: 500;
      margin-bottom: 35px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #000000;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .input-field {
      width: 100%;
      padding: 14px 20px;
      background-color: #BBE5C8;
      border: 1.5px solid transparent;
      border-radius: 25px;
      font-size: 13px;
      color: #2D4D3A;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field::placeholder {
      color: #6C937A;
    }

    .input-field:focus {
      border-color: #0E6C45;
      background-color: #c7eed3;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      margin-bottom: 30px;
      font-size: 13px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #0E6C45;
      font-weight: 600;
    }

    .remember-me input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background-color: #D6D6D6;
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }

    .remember-me input[type="checkbox"]:checked {
      background-color: #0E6C45;
    }

    .remember-me input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      color: white;
      font-size: 12px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .forgot-password {
      color: #0E6C45;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .forgot-password:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background-color: #054C33;
      color: #FFFFFF;
      border: none;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-login:hover {
      background-color: #033624;
    }

   
    @media (max-width: 850px) {
      .container {
        flex-direction: column;
        gap: 30px;
      }

      .left-section {
        align-items: center;
        text-align: center;
      }

      .brand-header {
        margin-bottom: 20px;
      }

      .right-section {
        width: 100%;
      }

      .login-card {
        padding: 40px 25px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
   
    <div class="left-section">
      <div class="brand-header">
        <div class="logo-container">
          <div class="calendar-icon-box">
           
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 15l2 2 4-4" />
            </svg>
          </div>
          <span class="brand-title">GCync</span>
        </div>
        <div class="brand-subtitle">Gordon College Calendar Sync</div>
      </div>

      <div class="illustration-container">
       
        <img class="illustration-img" src="mascot.jpg" alt="GCync Mascot">
      </div>
    </div>

    
    <div class="right-section">
      <div class="login-card">
        <h1>WELCOME!</h1>
        <p class="subtitle">Log in to continue to your account.</p>

        <form action="#" method="POST">
          <div class="form-group">
            <label for="email">EMAIL ADDRESS:</label>
            <input type="email" id="email" class="input-field" placeholder="Enter your email address" required>
          </div>

          <div class="form-group">
            <label for="password">PASSWORD:</label>
            <input type="password" id="password" class="input-field" placeholder="Enter password" required>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox">
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-password">Forgot password?</a>
          </div>

          <button type="submit" class="btn-login">LOG IN</button>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
